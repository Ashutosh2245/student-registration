<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.25);
        }

        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            min-height: 15px;
        }

        .success-input {
            border-color: #2ecc71 !important;
        }

        .error-input {
            border-color: #e74c3c !important;
        }

        .gender-options {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .gender-options label {
            font-weight: normal;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .terms input {
            width: auto;
        }

        .terms label {
            margin: 0;
            font-weight: normal;
            font-size: 14px;
        }

        .button-container {
            margin-top: 25px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        #successMessage {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #e8f8f0;
            color: #27ae60;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: 1;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Student Registration</h1>
        <p>Create your student account by filling in the details below.</p>
    </div>

    <form id="registrationForm" novalidate>

        <div class="form-grid">

            <!-- Name -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <span class="error" id="nameError"></span>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@email.com">
                <span class="error" id="emailError"></span>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="10-digit phone number">
                <span class="error" id="phoneError"></span>
            </div>

            <!-- Age -->
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter your age">
                <span class="error" id="ageError"></span>
            </div>

            <!-- Course -->
            <div class="form-group">
                <label for="course">Course</label>
                <select id="course">
                    <option value="">Select Course</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                    <option value="M.Tech">M.Tech</option>
                </select>
                <span class="error" id="courseError"></span>
            </div>

            <!-- Student ID -->
            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" placeholder="Enter student ID">
                <span class="error" id="studentIdError"></span>
            </div>

            <!-- Gender -->
            <div class="form-group full-width">
                <label>Gender</label>

                <div class="gender-options">
                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                </div>

                <span class="error" id="genderError"></span>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 8 characters">
                <span class="error" id="passwordError"></span>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password">
                <span class="error" id="confirmPasswordError"></span>
            </div>

            <!-- Terms -->
            <div class="form-group full-width">

                <div class="terms">
                    <input type="checkbox" id="terms">

                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>
                </div>

                <span class="error" id="termsError"></span>

            </div>

        </div>

        <div class="button-container">
            <button type="submit">Register Student</button>
        </div>

        <div id="successMessage">
            Registration successful! 🎉
        </div>

    </form>

</div>

<script>

    const form = document.getElementById("registrationForm");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        let isValid = true;

        clearErrors();

        // Name validation
        const name = document.getElementById("name").value.trim();

        if (name === "") {
            showError("name", "Full name is required.");
            isValid = false;
        }
        else if (!/^[A-Za-z ]{3,50}$/.test(name)) {
            showError("name", "Name must contain only letters and spaces.");
            isValid = false;
        }
        else {
            markSuccess("name");
        }


        // Email validation
        const email = document.getElementById("email").value.trim();

        if (email === "") {
            showError("email", "Email is required.");
            isValid = false;
        }
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showError("email", "Enter a valid email address.");
            isValid = false;
        }
        else {
            markSuccess("email");
        }


        // Phone validation
        const phone = document.getElementById("phone").value.trim();

        if (phone === "") {
            showError("phone", "Phone number is required.");
            isValid = false;
        }
        else if (!/^[6-9]\d{9}$/.test(phone)) {
            showError("phone", "Enter a valid 10-digit phone number.");
            isValid = false;
        }
        else {
            markSuccess("phone");
        }


        // Age validation
        const age = document.getElementById("age").value;

        if (age === "") {
            showError("age", "Age is required.");
            isValid = false;
        }
        else if (age < 16 || age > 100) {
            showError("age", "Age must be between 16 and 100.");
            isValid = false;
        }
        else {
            markSuccess("age");
        }


        // Course validation
        const course = document.getElementById("course").value;

        if (course === "") {
            showError("course", "Please select a course.");
            isValid = false;
        }
        else {
            markSuccess("course");
        }


        // Student ID validation
        const studentId = document.getElementById("studentId").value.trim();

        if (studentId === "") {
            showError("studentId", "Student ID is required.");
            isValid = false;
        }
        else if (!/^[A-Za-z0-9-]{3,20}$/.test(studentId)) {
            showError("studentId", "Enter a valid student ID.");
            isValid = false;
        }
        else {
            markSuccess("studentId");
        }


        // Gender validation
        const gender = document.querySelector(
            'input[name="gender"]:checked'
        );

        if (!gender) {
            document.getElementById("genderError").textContent =
                "Please select your gender.";
            isValid = false;
        }


        // Password validation
        const password = document.getElementById("password").value;

        if (password === "") {
            showError("password", "Password is required.");
            isValid = false;
        }
        else if (password.length < 8) {
            showError("password", "Password must contain at least 8 characters.");
            isValid = false;
        }
        else if (!/(?=.*[A-Z])(?=.*[a-z])(?=.*\d)/.test(password)) {
            showError(
                "password",
                "Use uppercase, lowercase and a number."
            );
            isValid = false;
        }
        else {
            markSuccess("password");
        }


        // Confirm password
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (confirmPassword === "") {
            showError(
                "confirmPassword",
                "Please confirm your password."
            );
            isValid = false;
        }
        else if (password !== confirmPassword) {
            showError(
                "confirmPassword",
                "Passwords do not match."
            );
            isValid = false;
        }
        else {
            markSuccess("confirmPassword");
        }


        // Terms validation
        const terms = document.getElementById("terms").checked;

        if (!terms) {
            document.getElementById("termsError").textContent =
                "You must accept the terms and conditions.";
            isValid = false;
        }


        // Final result
        if (isValid) {

            document.getElementById("successMessage").style.display =
                "block";

            form.reset();

            document.querySelectorAll("input, select").forEach(element => {
                element.classList.remove("success-input");
            });
        }
    });


    function showError(field, message) {

        document.getElementById(field + "Error").textContent = message;

        document.getElementById(field).classList.add("error-input");
    }


    function markSuccess(field) {

        document.getElementById(field).classList.add("success-input");
    }


    function clearErrors() {

        document.querySelectorAll(".error").forEach(error => {
            error.textContent = "";
        });

        document.querySelectorAll("input, select").forEach(element => {
            element.classList.remove("error-input");
            element.classList.remove("success-input");
        });

        document.getElementById("successMessage").style.display = "none";
    }

</script>

</body>
</html>
